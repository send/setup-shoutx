name: Setup shoutx
description: Install an exact, verified shoutx release
inputs:
  shoutx-version:
    description: Exact CLI version, without a leading v (at least 0.3.0-rc.1)
    required: true
  checksums-sha256:
    description: Optional lowercase SHA-256 of the release SHA256SUMS file
    required: false
  github-token:
    description: Optional token used only for fixed-origin GitHub API metadata
    required: false
outputs:
  version:
    description: Installed CLI version without a leading v
runs:
  using: node24
  main: dist/index.cjs
